<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        /* 기본 스타일 */
        body {
            font-family:sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* 로그인 폼 컨테이너 */
        #loginForm {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        /* ID/PW 입력 필드를 감싸는 단락 */
        form p {
            margin-bottom: 15px;
            text-align: left;
        }

        /* 입력 필드 스타일 */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* 패딩이 너비에 포함되도록 */
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }

        /* 버튼 스타일 */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* 에러 메시지 스타일 */
        #error-message {
            margin-top: 15px;
            height: 20px; /* 메시지가 없을 때도 공간을 차지해 레이아웃이 흔들리지 않게 함 */
        }
    </style>
</head>
<body>

<form id="loginForm">
    <h1>Todo List 로그인</h1>
    <p><input type="text" id="userId" placeholder="admin"></p>
    <p><input type="password" id="userPw" placeholder="1234"></p>
    <button type="submit">로그인</button>
    <p id="error-message" style="color:red;"></p>
</form>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('userId').value;
        const pw = document.getElementById('userPw').value;
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${encodeURIComponent(id)}&password=${encodeURIComponent(pw)}`
        });
        if (response.ok) {
            window.location.href = '/todos';
        } else {
            document.getElementById('error-message').textContent = '아이디 또는 비밀번호가 틀렸습니다.';
        }
    });
</script>
</body>
</html>
