<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Simple Todo List</title>
    <style>
        /* 기본 스타일 초기화 및 전체 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        /* 전체 Todo 앱을 감싸는 컨테이너 */
        .todo-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* 할 일 입력 폼 */
        .todo-form {
            display: flex;
            margin-bottom: 20px;
        }

        #todoInput {
            flex-grow: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-right: none;
            border-radius: 8px 0 0 8px; /* 왼쪽 모서리만 둥글게 */
            outline: none;
            transition: border-color 0.3s;
        }

        #todoInput:focus {
            border-color: #4a90e2;
        }

        .todo-form button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            border-radius: 0 8px 8px 0; /* 오른쪽 모서리만 둥글게 */
            transition: background-color 0.3s;
        }

        .todo-form button:hover {
            background-color: #357abd;
        }

        /* 할 일 목록 */
        #todo-list {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        #todo-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        #todo-list li:hover {
            background-color: #f9f9f9;
        }

        .delete-btn {
            color: #d9534f;
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        /* 하단 버튼 컨테이너 */
        .bottom-buttons {
            display: flex;
            justify-content: flex-end; /* 버튼을 오른쪽으로 정렬 */
            gap: 10px; /* 버튼 사이 간격 */
        }

        /* 하단 버튼 공통 스타일 */
        .bottom-buttons button {
            padding: 10px 15px;
            border: 1px solid #ccc;
            background-color: #f7f7f7;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .bottom-buttons button:hover {
            background-color: #e9e9e9;
            border-color: #999;
        }

        #clearAllBtn {
            color: #d9534f; /* 빨간색 계열 */
        }

        #logoutBtn {
            color: #555; /* 회색 계열 */
        }

    </style>
</head>
<body>

<div class="todo-container">
    <h1>Todo List</h1>

    <form class="todo-form" id="todoForm">
        <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요">
        <button type="submit">추가</button>
    </form>

    <ul id="todo-list">
    </ul>

    <div class="bottom-buttons">
        <button id="clearAllBtn">모두 삭제</button>
        <button id="logoutBtn">로그아웃</button>
    </div>
</div>

<script>
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todo-list');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const TODOS_KEY = 'todos';

    function getTodosFromStorage() {
        const data = localStorage.getItem(TODOS_KEY);
        return data ? JSON.parse(data) : [];
    }

    function renderTodos() {
        const todos = getTodosFromStorage();
        todoList.innerHTML = '';
        todos.forEach((todoText, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${todoText}</span><span class="delete-btn" data-index="${index}">삭제</span>`;
            li.querySelector('.delete-btn').addEventListener('click', () => {
                deleteTodo(index);
            });
            todoList.appendChild(li);
        });
    }

    function addTodo(todoText) {
        const todos = getTodosFromStorage();
        todos.push(todoText);
        localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
        renderTodos();
    }

    function deleteTodo(index) {
        const todos = getTodosFromStorage();
        todos.splice(index, 1);
        localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
        renderTodos();
    }

    function clearAllTodos() {
        localStorage.removeItem(TODOS_KEY);
        renderTodos();
    }

    todoForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (todoInput.value) {
            addTodo(todoInput.value);
            todoInput.value = '';
        }
    });

    clearAllBtn.addEventListener('click', () => {
        if (confirm('정말 모든 할 일을 삭제하시겠습니까?')) {
            clearAllTodos();
        }
    });

    logoutBtn.addEventListener('click', async () => {
        // 1. 서버에 로그아웃 요청을 보냄
        const response = await fetch('/api/logout');

        // 2. 서버가 성공적으로 응답하면, 로그인 페이지로 강제 이동
        if (response.ok) {
            window.location.href = '/login';
        } else {
            alert("로그아웃에 실패했습니다.");
        }
    });

    renderTodos();
</script>

</body>
</html>
